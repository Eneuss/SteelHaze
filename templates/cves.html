{% extends "base.html" %}
{% block title %}CVE Findings{% endblock %}

{% block content %}
<!-- cve findings -->
<div id="cves-container">
  <div class="empty">Loading...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadPage() {
  const data = await fetch('/api/ports_and_cves').then(r => r.json());
  const container = document.getElementById('cves-container');

  if (!data.length) {
    container.innerHTML = '<div class="empty">No CVE data yet. Deep scanner runs automatically every 30 minutes.</div>';
    return;
  }

  container.innerHTML = data.map(host => {
    const vulnHtml = host.vulnerable_ports.map(p => `
      <div class="port-block">
        <div class="port-header has-cves">
          <span class="port-num">${p.port}/tcp</span>
          <span class="port-service">${p.service}</span>
          <span class="badge badge-red" style="margin-left:auto">${p.cves.length} CVE${p.cves.length > 1 ? 's' : ''}</span>
        </div>
        ${p.cves.map(c => `
        <div class="cve-row">
          <div class="cve-id"><a href="https://nvd.nist.gov/vuln/detail/${c.cve_id}" target="_blank">${c.cve_id}</a></div>
          <div><span class="sev-${c.severity}">${c.severity}</span></div>
          <div class="cve-desc">${c.description}</div>
        </div>`).join('')}
      </div>`).join('');

    const cleanHtml = host.clean_ports.length ? `
      <div class="clean-ports-section">
        <div class="clean-ports-label">Other open ports (no CVEs)</div>
        ${host.clean_ports.map(p => `<span class="clean-port-tag">${p.port}/tcp ${p.service}</span>`).join('')}
      </div>` : '';

    const badge = host.vulnerable_ports.length
      ? `<span class="badge badge-red" style="margin-left:auto">${host.vulnerable_ports.length} vulnerable port${host.vulnerable_ports.length > 1 ? 's' : ''}</span>`
      : `<span class="badge badge-green" style="margin-left:auto">No vulnerabilities</span>`;

    return `<div class="host-block">
      <div class="host-header">
        <span class="host-ip">${host.ip}</span>
        <span class="host-name">${host.hostname}</span>
        ${badge}
      </div>
      <div class="host-body">${vulnHtml}${cleanHtml}</div>
    </div>`;
  }).join('');
}

loadPage();
</script>
{% endblock %}
