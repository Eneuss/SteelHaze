<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteelHaze - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- header -->
<header role="banner">
  <h1>SteelHaze</h1>
  <span class="subtitle">Network Security Monitor</span>
  <button id="theme-toggle" onclick="toggleTheme()" aria-label="Switch colour theme">Light</button>
  <span id="refresh-timer" aria-hidden="true">Refreshing in <b id="countdown">30</b>s</span>
</header>

<!-- nav -->
<nav aria-label="Main navigation">
  <a href="{{ url_for('devices') }}"   class="{{ 'active' if active == 'devices' }}"   {% if active == 'devices' %}aria-current="page"{% endif %}>Devices</a>
  <a href="{{ url_for('traffic') }}"   class="{{ 'active' if active == 'traffic' }}"   {% if active == 'traffic' %}aria-current="page"{% endif %}>Traffic</a>
  <a href="{{ url_for('anomalies') }}" class="{{ 'active' if active == 'anomalies' }}" {% if active == 'anomalies' %}aria-current="page"{% endif %}>Anomalies</a>
  <a href="{{ url_for('cves') }}"      class="{{ 'active' if active == 'cves' }}"      {% if active == 'cves' %}aria-current="page"{% endif %}>CVE Findings</a>
  <a href="{{ url_for('timeline') }}"  class="{{ 'active' if active == 'timeline' }}"  {% if active == 'timeline' %}aria-current="page"{% endif %}>Charts</a>
</nav>

<main id="main-content">
  <!-- stats bar -->
  <div class="stats-grid" role="region" aria-label="Network statistics">
    <div class="stat-card blue">  <div class="label" id="lbl-total">Total Devices</div> <div class="value" id="stat-total" aria-labelledby="lbl-total" aria-live="polite">—</div></div>
    <div class="stat-card green"> <div class="label" id="lbl-active">Active Now</div>    <div class="value" id="stat-active" aria-labelledby="lbl-active" aria-live="polite">—</div></div>
    <div class="stat-card yellow"><div class="label" id="lbl-unknown">Unknown</div>      <div class="value" id="stat-unknown" aria-labelledby="lbl-unknown" aria-live="polite">—</div></div>
    <div class="stat-card red">   <div class="label" id="lbl-anomalies">Anomalies (24h)</div><div class="value" id="stat-anomalies" aria-labelledby="lbl-anomalies" aria-live="polite">—</div></div>
    <div class="stat-card purple"><div class="label" id="lbl-cves">CVEs Found</div>     <div class="value" id="stat-cves" aria-labelledby="lbl-cves" aria-live="polite">—</div></div>
  </div>

  <!-- page content goes here -->
  {% block content %}{% endblock %}
</main>

<!-- shared js helpers -->
<script>
function fmtBytes(b) {
  if (b == null) return '—';
  if (b < 1024)       return b + ' B';
  if (b < 1048576)    return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}
function parseUTC(s) { return s ? new Date(s.trim().replace(' ', 'T') + 'Z') : null; }
function fmtTime(s)  { const d = parseUTC(s); return d ? d.toLocaleString()     : '—'; }
function fmtShort(s) { const d = parseUTC(s); return d ? d.toLocaleTimeString() : '—'; }

async function loadStats() {
  const d = await fetch('/api/stats').then(r => r.json());
  document.getElementById('stat-total').textContent     = d.total;
  document.getElementById('stat-active').textContent    = d.active;
  document.getElementById('stat-unknown').textContent   = d.unknown;
  document.getElementById('stat-anomalies').textContent = d.anomalies;
  document.getElementById('stat-cves').textContent      = d.cves;
}

if (!localStorage.getItem('lastRefresh')) {
  localStorage.setItem('lastRefresh', Date.now());
}
const lastRefresh = parseInt(localStorage.getItem('lastRefresh'));
const elapsed = Math.floor((Date.now() - lastRefresh) / 1000);
let seconds = elapsed >= 30 ? 1 : Math.max(1, 30 - elapsed);
document.getElementById('countdown').textContent = seconds;

setInterval(() => {
  seconds--;
  document.getElementById('countdown').textContent = seconds;
  if (seconds <= 0) {
    seconds = 30;
    localStorage.setItem('lastRefresh', Date.now());
    loadStats();
    loadPage();
  }
}, 1000);

loadStats();

function toggleTheme() {
  const light = document.body.classList.toggle('light');
  localStorage.setItem('theme', light ? 'light' : 'dark');
  document.getElementById('theme-toggle').textContent = light ? 'Dark' : 'Light';
}

(function() {
  const saved = localStorage.getItem('theme');
  const light = saved ? saved === 'light' : false;
  if (light) document.body.classList.add('light');
  document.getElementById('theme-toggle').textContent = light ? 'Dark' : 'Light';
})();
</script>

<!-- page specific js goes here -->
{% block scripts %}{% endblock %}

</body>
</html>
