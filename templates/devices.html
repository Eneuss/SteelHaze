{% extends "base.html" %}
{% block title %}Devices{% endblock %}

{% block content %}
<!-- per-interface device sections -->
<div id="interfaces-container" aria-live="polite" aria-label="Network interfaces">
  <div class="empty">Loading...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = Date.now() - parseUTC(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function lastSeenClass(dateStr) {
  const mins = Math.floor((Date.now() - parseUTC(dateStr).getTime()) / 60000);
  if (mins < 5)  return 'time-active';
  if (mins < 60) return 'time-recent';
  return 'time-stale';
}

const sid = mac => (mac || '').replace(/:/g, '');

const STATUS_BADGE = {
  scanning:   '<span class="badge badge-yellow">Scanning…</span>',
  done:       '<span class="badge badge-green">Done</span>',
  no_devices: '<span class="badge badge-grey">No devices</span>',
  error:      '<span class="badge badge-red">Error</span>',
  idle:       '<span class="badge badge-grey">Idle</span>',
};

function showMarkKnown(mac) {
  const s = sid(mac);
  document.getElementById('ac-' + s).innerHTML =
    `<input type="text" id="li-${s}" class="label-input" placeholder="Label (optional)" aria-label="Device label (optional)" />
     <button class="btn btn-confirm" onclick="confirmMarkKnown('${mac}')">Confirm</button>
     <button class="btn" onclick="loadPage()">Cancel</button>`;
  document.getElementById('li-' + s).focus();
}

async function confirmMarkKnown(mac) {
  const label = document.getElementById('li-' + sid(mac)).value.trim();
  await fetch('/api/mark_known/' + encodeURIComponent(mac), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: label || null }),
  });
  loadPage();
  loadStats();
}

function showEditLabel(mac, current) {
  const s = sid(mac);
  document.getElementById('lc-' + s).innerHTML =
    `<input type="text" id="le-${s}" class="label-input" value="${current || ''}" placeholder="Label" aria-label="Device label" />
     <button class="btn btn-confirm" onclick="saveLabel('${mac}')">Save</button>
     <button class="btn" onclick="loadPage()">Cancel</button>`;
  document.getElementById('le-' + s).focus();
}

async function saveLabel(mac) {
  const label = document.getElementById('le-' + sid(mac)).value.trim();
  await fetch('/api/set_label/' + encodeURIComponent(mac), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: label || null }),
  });
  loadPage();
}

function deviceRow(d) {
  const now = Date.now();
  const active = (now - parseUTC(d.last_seen).getTime()) < 300000;
  const statusLabel = active ? 'Active' : 'Offline';
  const dot = `<span class="status-dot ${active ? 'dot-active' : 'dot-offline'}" aria-hidden="true"></span><span class="sr-only">${statusLabel}</span>`;
  const knownBadge = d.is_known
    ? '<span class="badge badge-green">Known</span>'
    : '<span class="badge badge-yellow">Unknown</span>';
  const lsCls = lastSeenClass(d.last_seen);
  const s = sid(d.mac || '');

  const labelCell = d.label
    ? `<td id="lc-${s}">
         <span class="device-label">${d.label}</span>
         ${d.is_known ? `<button class="edit-icon" aria-label="Edit label for ${d.label}" onclick="showEditLabel('${d.mac}', '${d.label.replace(/'/g, "\\'")}')">✎</button>` : ''}
       </td>`
    : d.is_known
    ? `<td id="lc-${s}">
         <span class="no-label">—</span>
         <button class="edit-icon" aria-label="Add label for ${d.mac || d.ip}" onclick="showEditLabel('${d.mac}', '')">✎</button>
       </td>`
    : `<td id="lc-${s}"></td>`;

  const actionCell = d.is_known || !d.mac || d.mac === 'N/A'
    ? `<td id="ac-${s}"></td>`
    : `<td id="ac-${s}"><button class="btn" onclick="showMarkKnown('${d.mac}')">Mark Known</button></td>`;

  return `<tr>
    <td>${dot}<code>${d.ip}</code></td>
    <td><code>${d.mac || '—'}</code></td>
    ${labelCell}
    <td>
      <span class="time-rel">${timeAgo(d.first_seen)}</span>
      <span class="time-abs">${fmtTime(d.first_seen)}</span>
    </td>
    <td>
      <span class="time-rel ${lsCls}">${timeAgo(d.last_seen)}</span>
      <span class="time-abs">${fmtTime(d.last_seen)}</span>
    </td>
    <td>${knownBadge}</td>
    ${actionCell}
  </tr>`;
}

async function loadPage() {
  const data = await fetch('/api/interfaces').then(r => r.json());
  const container = document.getElementById('interfaces-container');
  const ifaces = Object.keys(data);

  if (!ifaces.length) {
    container.innerHTML = '<div class="empty">Waiting for first scan…</div>';
    return;
  }

  container.innerHTML = ifaces.map(iface => {
    const info = data[iface];
    const badge = STATUS_BADGE[info.status] || STATUS_BADGE.idle;
    const errorNote = info.error
      ? `<div class="iface-error" role="alert">Error: ${info.error}</div>`
      : '';

    const now = Date.now();
    const devices = (info.devices || []).sort((a, b) => {
      const aA = (now - parseUTC(a.last_seen).getTime()) < 300000;
      const bA = (now - parseUTC(b.last_seen).getTime()) < 300000;
      if (aA !== bA) return aA ? -1 : 1;
      return new Date(b.last_seen) - new Date(a.last_seen);
    });

    const passive = info.passive || [];
    const total = devices.length + passive.length;
    const label = info.ssid || iface;

    let tableHtml;
    if (!devices.length && !passive.length) {
      tableHtml = `<div class="empty" style="padding:16px">${info.status === 'error' ? 'Scan failed.' : 'No devices found yet.'}</div>`;
    } else {
      const rows = [
        ...devices.map(deviceRow),
        ...(passive.length ? [
          `<tr class="passive-divider"><td colspan="7">Passive detection — not responding to scan</td></tr>`,
          ...passive.map(deviceRow),
        ] : []),
      ].join('');
      tableHtml = `<table aria-label="Devices on ${label}">
           <thead><tr>
             <th scope="col">IP</th><th scope="col">MAC</th><th scope="col">Label</th>
             <th scope="col">First Seen</th><th scope="col">Last Seen</th><th scope="col">Status</th><th scope="col">Action</th>
           </tr></thead>
           <tbody>${rows}</tbody>
         </table>`;
    }

    return `<div class="card" style="margin-bottom:20px" role="region" aria-label="${label}">
      <div class="card-header iface-header">
        <span class="iface-name">${label}</span>
        <span class="iface-subnet">${info.subnet || ''}</span>
        ${badge}
        <span class="iface-count" aria-label="${total} device${total !== 1 ? 's' : ''}">${total} device${total !== 1 ? 's' : ''}</span>
      </div>
      ${errorNote}
      ${tableHtml}
    </div>`;
  }).join('');
}

loadPage();
</script>
{% endblock %}
